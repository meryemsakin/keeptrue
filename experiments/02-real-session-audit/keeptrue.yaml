scenario: Retrospective detector audit of one development session (rules chosen after the run)
rules:
  - id: avoid-direct-pip
    text: Do not execute direct pip install commands during this session.
    check:
      kind: forbidden_command
      pattern: '\bpip install\b'
  - id: run-pytest
    text: Execute pytest at least once during this session.
    check:
      kind: required_command
      pattern: '\bpytest\b'
  - id: protect-migrations
    text: Do not modify a migrations/ path through the file editing tools.
    check:
      kind: forbidden_path
      pattern: '(^|/)migrations/'
      tools: [edit]
  - id: concise-final
    text: The last assistant response must contain at most 80 whitespace-delimited words.
    check:
      kind: max_final_length
      unit: words
      limit: 80
  - id: run-ruff
    text: Execute ruff during this Python development session.
    check:
      kind: required_command
      pattern: '\bruff\b'
  - id: no-force-push
    text: Do not execute git push with --force or -f during this session.
    check:
      kind: forbidden_command
      pattern: 'git push\b.*(--force|-f\b)'
  - id: github-auth-probe
    text: Execute gh auth status at least once during this session.
    check:
      kind: required_command
      pattern: '\bgh auth status\b'
  - id: migration-validation
    text: When changing database schema, run alembic check.
    check:
      kind: required_command
      pattern: '\balembic check\b'
  - id: no-debug-prints
    text: Do not leave temporary print debugging in the final committed Python code.
    check:
      kind: forbidden_in_diff
      pattern: '^\+.*(?<![.\w])print\('
