[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keeptrue"
version = "0.1.0"
description = "Measure whether your coding agent actually follows the rules in AGENTS.md / CLAUDE.md."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Meryem Sakin", email = "meryemmsakinn@gmail.com" }]
keywords = ["coding-agent", "agents-md", "claude-code", "llm", "evaluation", "instruction-following"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
judge = ["anthropic>=0.40"]
dev = ["pytest>=7"]

[project.scripts]
keeptrue = "keeptrue.cli:main"

[project.urls]
Homepage = "https://github.com/meryemsakin/keeptrue"
Issues = "https://github.com/meryemsakin/keeptrue/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/keeptrue"]

[tool.pytest.ini_options]
# experiments/04 ships a sandbox project whose tests fail on purpose
testpaths = ["tests"]
