<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" role="img" aria-labelledby="title description" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
  <title id="title">keeptrue demo — observed adherence drops in illustrative runs</title>
  <desc id="description">Selected rows from the bundled demo, with nine decidable runs and zero unknowns per model. The use-uv and pytest checks drop from 100% to 0%. This is hand-authored example data, not a causal model-upgrade finding or a full terminal screenshot.</desc>
  <defs>
    <style>
      text { font-size: 16px; }
      .title { font-size: 13px; fill: #a6a79a; }
      .small { font-size: 14px; }
      .dim { fill: #a6a79a; }
      .white { fill: #f8f8f2; }
      .green { fill: #a6e22e; }
      .red { fill: #f92672; }
      .cyan { fill: #66d9ef; }
      .b { font-weight: 700; }
      .command { animation: command 12s infinite; }
      .heading { animation: heading 12s infinite; }
      .rows { animation: rows 12s infinite; }
      .details { animation: details 12s infinite; }
      @keyframes command { 0%, 3%, 100% { opacity: 0; } 8%, 94% { opacity: 1; } }
      @keyframes heading { 0%, 14%, 100% { opacity: 0; } 20%, 94% { opacity: 1; } }
      @keyframes rows { 0%, 25%, 100% { opacity: 0; } 32%, 94% { opacity: 1; } }
      @keyframes details { 0%, 40%, 100% { opacity: 0; } 48%, 94% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .command, .heading, .rows, .details { animation: none; opacity: 1; }
      }
    </style>
  </defs>

  <rect x="10" y="10" width="880" height="560" rx="12" fill="#1e1f1c" stroke="#33352e"/>
  <rect x="10" y="10" width="880" height="36" rx="12" fill="#2a2c26"/>
  <rect x="10" y="34" width="880" height="12" fill="#2a2c26"/>
  <circle cx="34" cy="28" r="6" fill="#ff5f56"/>
  <circle cx="54" cy="28" r="6" fill="#ffbd2e"/>
  <circle cx="74" cy="28" r="6" fill="#27c93f"/>
  <text class="title" x="450" y="32" text-anchor="middle">keeptrue demo · illustrative data</text>

  <g class="command">
    <text x="30" y="83"><tspan class="green">$ </tspan><tspan class="white">keeptrue demo</tspan></text>
  </g>
  <g class="heading">
    <text class="dim small" x="30" y="116">Selected rows from the bundled demo · 3 tasks × 3 runs per model</text>
    <text y="159">
      <tspan class="dim" x="30">Rule</tspan>
      <tspan class="dim small" x="620" text-anchor="end">agent-v1-old ·baseline</tspan>
      <tspan class="dim small" x="850" text-anchor="end">agent-v2-new</tspan>
    </text>
    <line x1="30" y1="172" x2="855" y2="172" stroke="#44473d"/>
  </g>

  <!-- Values match the real demo fixtures and terminal report. -->
  <g class="rows">
    <text y="206">
      <tspan class="white" x="30">Use uv, never pip install</tspan>
      <tspan class="green" x="620" text-anchor="end">100% (n=9, ?=0)</tspan>
      <tspan class="red" x="850" text-anchor="end">0% (n=9, ?=0) ⬇</tspan>
    </text>
    <text y="238">
      <tspan class="white" x="30">Always run pytest before finishing</tspan>
      <tspan class="green" x="620" text-anchor="end">100% (n=9, ?=0)</tspan>
      <tspan class="red" x="850" text-anchor="end">0% (n=9, ?=0) ⬇</tspan>
    </text>
    <text y="270">
      <tspan class="white" x="30">No print() debug in the diff</tspan>
      <tspan class="green" x="620" text-anchor="end">100% (n=9, ?=0)</tspan>
      <tspan class="red" x="850" text-anchor="end">33% (n=9, ?=0) ⬇</tspan>
    </text>
    <text y="302">
      <tspan class="white" x="30">Never edit files under migrations/</tspan>
      <tspan class="green" x="620" text-anchor="end">100% (n=9, ?=0)</tspan>
      <tspan class="green" x="850" text-anchor="end">100% (n=9, ?=0)</tspan>
    </text>
    <text class="dim small" x="30" y="335">n = decidable runs; ? = unknown evidence, excluded from the denominator.</text>
  </g>

  <g class="details">
    <text class="red b" x="30" y="380">Observed adherence drops</text>
    <text class="white" x="30" y="411">Use uv: 100% → 0% (−100 pts)</text>
    <text class="dim small" x="50" y="433">command matched: pip install requests</text>
    <text class="white" x="30" y="464">Run pytest: 100% → 0% (−100 pts)</text>
    <text class="dim small" x="50" y="486">no confirmed command matched /\bpytest\b/</text>
  </g>

  <!-- Provenance and interpretation stay visible throughout the animation. -->
  <text class="cyan small" x="30" y="528">Hand-authored illustrative runs · selected rows, not a full screenshot</text>
  <text class="dim small" x="30" y="550">Descriptive comparison only: task mix and rule applicability are not controlled.</text>
</svg>
