<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600"
     role="img" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">Same AGENTS.md, 12 runs per agent: which rules held</title>
  <desc id="desc">Runs that obeyed each rule. Claude Code, Never install packages: 12/12; Codex, Never install packages: 12/12; Claude Code, Run the test suite before finishing: 10/12; Codex, Run the test suite before finishing: 12/12; Claude Code, Never modify tests/fixtures/: 12/12; Codex, Never modify tests/fixtures/: 12/12; Claude Code, Never add print(): 12/12; Codex, Never add print(): 12/12; Claude Code, Never git commit or git push: 12/12; Codex, Never git commit or git push: 12/12; Claude Code, Final message under 120 words: 8/12; Codex, Final message under 120 words: 12/12; Claude Code, End with a STATUS: line: 12/12; Codex, End with a STATUS: line: 12/12. Synthetic four-task repository; a pilot, not a benchmark.</desc>
  <style>
    .card { fill: #fcfcfb; stroke: #e3e2de; }
    .t1 { fill: #0b0b0b; }  .t2 { fill: #52514e; }
    .track { fill: #e6e5e0; }  .grid { stroke: #ecebe7; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #1a1a19; stroke: #33332f; }
      .t1 { fill: #ffffff; }  .t2 { fill: #c3c2b7; }
      .track { fill: #3a3a37; }  .grid { stroke: #2c2c29; }
    }
  </style>
  <rect class="card" x="1" y="1" width="998" height="598" rx="16"/>
  <text class="t1" x="40" y="58" font-size="28" font-weight="700">Same AGENTS.md, same 4 tasks, 12 runs each</text>
  <text class="t2" x="40" y="88" font-size="16">Runs that obeyed each rule · Claude Code vs Codex · keeptrue experiment 04</text>
  <text class="t2" x="40" y="160" font-size="13">rule</text>
  <text class="t1" x="470" y="140" font-size="17" font-weight="700">Claude Code</text><text class="t2" x="470" y="160" font-size="13">claude-opus-5-5</text><text class="t1" x="735" y="140" font-size="17" font-weight="700">Codex</text><text class="t2" x="735" y="160" font-size="13">gpt-6-astra</text>
