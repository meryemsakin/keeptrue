name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: smoke-test the hero command
        run: keeptrue demo
      - name: smoke-test the synthetic experiment pipeline (no model calls)
        run: python examples/ablation/offline_demo.py --output "$RUNNER_TEMP/keeptrue-ablation-demo"
